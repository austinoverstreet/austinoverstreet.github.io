# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Austin Overstreet
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: austinoverstreet.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    # Fonts are hosted on this site (quartz/static/fonts), not loaded from Google.
    fontOrigin: local
    cdnCaching: false
    typography:
      header: JetBrains Mono
      body: Inter
      code: JetBrains Mono
    # Catppuccin Latte (light) and Mocha (dark) with a sapphire accent (light uses a
    # slightly deeper sapphire so links stay readable).
    colors:
      lightMode:
        light: "#eff1f5"
        lightgray: "#ccd0da"
        gray: "#6c6f85"
        darkgray: "#5c5f77"
        dark: "#4c4f69"
        secondary: "#157089"
        tertiary: "#04a5e5"
        highlight: rgba(21, 112, 137, 0.12)
        textHighlight: "#df8e1d55"
      darkMode:
        light: "#11111b"
        lightgray: "#313244"
        gray: "#9399b2"
        darkgray: "#bac2de"
        dark: "#cdd6f4"
        secondary: "#74c7ec"
        tertiary: "#89dceb"
        highlight: rgba(116, 199, 236, 0.14)
        textHighlight: "#f9e2af55"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  # --- Custom components (code lives in ./custom, linked via package.json) ---
  # Recent letters list: home page only, newest first.
  - source: "@austin/recent-posts"
    enabled: true
    options:
      title: Recent letters
      limit: 5
      folder: posts
    layout:
      position: afterBody
      priority: 50
  # Full-page wallpaper: a still image for everyone, plus a silent looping video
  # on wide screens (skipped for reduced-motion / data-saver visitors).
  # Files live in quartz/static/wallpaper.
  - source: "@austin/site-wallpaper"
    enabled: true
    options:
      # "Waves, sea, ocean" by RostislavUzunov, Pixabay Content License (free use,
      # no credit required). Re-encoded smaller and silent.
      poster: /static/wallpaper/waves.jpg
      video: /static/wallpaper/waves.mp4
      minWidth: 1000
    layout:
      position: footer
      priority: 10
  # Top bar links (also sets dark as the default theme for first-time visitors).
  # href is relative to the site root; "subscribe" is its own page.
  - source: "@austin/site-nav"
    enabled: true
    options:
      defaultTheme: dark
      links:
        - label: home
          href: ""
        - label: about
          href: "about"
        - label: books
          href: "books"
        - label: letters
          href: "posts/"
        - label: contact
          href: "contact"
        - label: subscribe
          href: "subscribe"
          pill: true
    layout:
      position: left
      priority: 15
  # "Subscribe to Chaos" box at the bottom of every page (not on pages listed in
  # hideOn). formAction is the public Kit form URL (Kit > form > Embed > HTML).
  - source: "@austin/post-signup"
    enabled: true
    options:
      formAction: "https://app.kit.com/forms/10096420/subscriptions"
      hideOn:
        - index
        - subscribed
        - confirmed
        - subscribe
      heading: Chaos Theory
      text: Letters, stories, and updates from behind the curtain, delivered to your inbox.
      placeholder: Email Address
      button: Subscribe to Chaos
    layout:
      position: afterBody
      priority: 60
  # Sends forms marked data-ajax-form (the contact form) in the background.
  - source: "@austin/site-forms"
    enabled: true
    layout:
      position: afterBody
      priority: 90
  # Footer: social links, copyright, Privacy and Contact.
  - source: "@austin/site-footer"
    enabled: true
    options:
      owner: Austin Overstreet
      social:
        - label: Instagram
          href: https://www.instagram.com/austinoverstreetofficial
        - label: TikTok
          href: https://www.tiktok.com/@thebadnewsbandit
        - label: Royal Road
          href: https://www.royalroad.com/profile/771836/fictions
      pages:
        - label: Privacy
          href: privacy
        - label: Contact
          href: contact
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
